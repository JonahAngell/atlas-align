<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATLAS Field Library Administration</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">ATLAS administration</p>
      <h1>Field Library replacement</h1>
      <p id="signedInUser" aria-live="polite">Resolving signed-in user...</p>
      <p class="warning">
        <strong>Warning:</strong> A successful upload atomically replaces every
        live row.
      </p>
      <section>
        <h2>Current library</h2>
        <dl>
          <div>
            <dt>Rows</dt>
            <dd id="rowCount">Loading...</dd>
          </div>
          <div>
            <dt>Sources</dt>
            <dd id="sourceCount">Loading...</dd>
          </div>
          <div>
            <dt>Columns</dt>
            <dd id="columnCount">Loading...</dd>
          </div>
        </dl>
      </section>
      <section>
        <h2>Upload replacement CSV</h2>
        <form id="replaceForm">
          <label for="csvFile">ATLAS Field Library CSV</label>
          <input id="csvFile" type="file" accept=".csv,text/csv" required />
          <label class="confirm"
            ><input id="confirmReplace" type="checkbox" required /> I understand
            this replaces all current rows.</label
          >
          <button type="submit">Validate and replace</button>
        </form>
        <pre id="result" role="status" aria-live="polite"></pre>
      </section>
    </main>
  </body>
</html>
