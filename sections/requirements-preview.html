<section
  class="page"
  data-page="preview"
  data-preview-view="both"
  id="page-preview"
>
  <div class="preview-pagehead">
    <div class="preview-heading">
      <h1>Requirements Preview</h1>
      <p class="subtitle">Live preview of the generated requirement output.</p>
    </div>
    <div class="preview-toolbar">
      <label class="check export-option"
        ><input checked="" id="includeNotesToggle" type="checkbox" /> Include
        notes in preview/export</label
      >
      <label
        class="check export-option"
        title="Each step repeats the conditions of the steps above it, so every row reads on its own."
        ><input id="completeStatementsToggle" type="checkbox" /> View as
        complete statements</label
      >
    </div>
  </div>
  <div
    aria-label="Requirements preview view"
    class="preview-pane-switch"
    data-preview-pane-switch
    role="tablist"
  >
    <button
      aria-controls="requirementsFieldsPanel"
      aria-selected="false"
      class="preview-pane-tab"
      data-preview-pane-tab="fields"
      id="previewPaneFieldsTab"
      role="tab"
      tabindex="-1"
      type="button"
    >
      Display Fields
    </button>
    <button
      aria-controls="requirementsLogicPanel"
      aria-selected="false"
      class="preview-pane-tab"
      data-preview-pane-tab="logic"
      id="previewPaneLogicTab"
      role="tab"
      tabindex="-1"
      type="button"
    >
      Audit Logic
    </button>
    <button
      aria-controls="requirementsFieldsPanel requirementsLogicPanel"
      aria-selected="true"
      class="preview-pane-tab"
      data-preview-pane-tab="both"
      id="previewPaneBothTab"
      role="tab"
      type="button"
    >
      Both
    </button>
  </div>
  <div class="preview-panels">
    <section
      aria-labelledby="previewFieldsHeading"
      class="card requirements-fields-panel preview-pane is-preview-pane-active"
      data-preview-pane="fields"
      id="requirementsFieldsPanel"
      role="tabpanel"
    >
      <h2 class="preview-pane-heading" id="previewFieldsHeading">
        Display Fields
      </h2>
      <div id="requirementsFieldsPreview"></div>
    </section>
    <section
      aria-labelledby="previewLogicHeading"
      class="card logic-preview-panel preview-pane is-preview-pane-active"
      data-preview-pane="logic"
      id="requirementsLogicPanel"
      role="tabpanel"
    >
      <h2 class="preview-pane-heading" id="previewLogicHeading">Audit Logic</h2>
      <div id="logicPreview"></div>
    </section>
  </div>
</section>
