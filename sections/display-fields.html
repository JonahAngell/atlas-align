<section class="page" data-page="display-fields" id="page-display-fields">
  <div class="pagehead display-fields-pagehead">
    <div class="display-fields-heading">
      <h1>Display Fields</h1>
      <p class="subtitle">Choose fields for the final audit output.</p>
    </div>
    <button class="btn primary" id="addDisplayFieldBtn" type="button">
      + Add Field
    </button>
  </div>
  <div class="card display-fields-card">
    <div class="status" id="displayFieldsStatus" aria-live="polite">
      Turn a field off to hide it from preview and export. Delete removes it
      from this list.
    </div>
    <div
      class="display-fields-toolbar"
      role="toolbar"
      aria-label="Display Fields bulk actions"
    >
      <button class="btn secondary" id="displayAllFieldsBtn" type="button">
        Display all fields
      </button>
      <div class="display-fields-sort" role="group" aria-label="Sort fields">
        <button
          class="btn secondary"
          id="displayFieldsSortSourceBtn"
          type="button"
          data-display-fields-sort="source"
        >
          Sort by source
        </button>
        <button
          class="btn secondary"
          id="displayFieldsSortAlphaBtn"
          type="button"
          data-display-fields-sort="alpha"
        >
          Sort A–Z
        </button>
      </div>
    </div>
    <div id="displayFieldsTable"></div>
  </div>
</section>
