<section class="page" data-page="display-fields" id="page-display-fields">

      <h1>Display Fields</h1>
      <p class="subtitle">Choose fields for the final audit output.</p>
    </div>
    <button class="btn primary" id="addDisplayFieldBtn" type="button">
